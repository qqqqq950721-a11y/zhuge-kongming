let cppEngine=null, cppSetPosition=null, cppBestMove=null, cppReady=false;
function boardForCpp(){
 const map={g:'k',a:'a',e:'e',h:'h',r:'r',c:'c',s:'p'};
 const cells=Array(90).fill('.');
 for(const p of board){const i=p.y*9+p.x;cells[i]=p.side==='r'?map[p.type].toUpperCase():map[p.type]}
 return cells.join('');
}
function cppMove(moves){
 if(!cppReady||!cppBestMove)return null;
 try{
  if(!cppSetPosition(boardForCpp(),-1))return null;
  const packed=cppBestMove(matchMedia('(max-width:899px)').matches?900:1400,12);
  if(packed<0)return null;
  const from=(packed>>8)&255,to=packed&255;
  return moves.find(m=>m.p.y*9+m.p.x===from&&m.m.y*9+m.m.x===to)||null;
 }catch(e){console.warn('C++ 引擎暫不可用，改用備援 AI',e);return null}
}
if(typeof createXiangqiEngine==='function'){
 createXiangqiEngine({locateFile:n=>n}).then(mod=>{
  cppEngine=mod;
  cppSetPosition=mod.cwrap('xq_set_position','number',['string','number']);
  cppBestMove=mod.cwrap('xq_best_move','number',['number','number']);
  cppReady=true;
  document.body.dataset.cppEngine='ready';
 }).catch(e=>console.warn('C++ 引擎載入失敗',e));
}
const jsChooseStrongMove=chooseStrongMove;
let cppWorker=null,cppWorkerReady=false,cppWorkerBusy=false,cppWorkerChoice=null,cppWorkerId=0;
function startCppWorker(){
 if(!window.Worker)return;
 try{
  cppWorker=new Worker('xiangqi-worker.js');
  cppWorker.onmessage=e=>{const d=e.data||{};if(d.type==='best'&&d.id===cppWorkerId){cppWorkerBusy=false;const moves=allMoves('b'),packed=Number(d.packed);if(packed>=0){const f=(packed>>8)&255,t=packed&255;cppWorkerChoice=moves.find(m=>m.p.y*9+m.p.x===f&&m.m.y*9+m.m.x===t)||null}syncAiTurnFixed()}else if(d.type==='error'){cppWorkerBusy=false;cppWorkerReady=false;syncAiTurnFixed()}};
  cppWorker.postMessage({type:'ready'});cppWorkerReady=true;
 }catch(e){cppWorker=null}
}

const syncAiTurnFixed=aiTurnFixed;
aiTurnFixed=function(){if(+$('level').value===4&&cppWorkerReady){if(cppWorkerChoice){const c=cppWorkerChoice;cppWorkerChoice=null;const original=cppMove;try{cppMove=()=>c;syncAiTurnFixed()}finally{cppMove=original;cppWorkerBusy=false}}else if(requestCppMove())return}syncAiTurnFixed()};
